services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: falaq_owner
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_only_change_me}
      POSTGRES_DB: falaq
      TZ: Asia/Tashkent
      # read by db/00_roles.sql when it creates the falaq_app role
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-dev_only_change_me}
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falaq_owner -d falaq"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-falaq}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-dev_only_change_me}
    ports: ["9000:9000", "9001:9001"]   # 9001 = admin konsoli
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
  miniodata:
